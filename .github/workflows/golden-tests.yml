name: Golden Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  golden-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run Golden Tests
      run: flutter test test/golden/
      
    - name: Upload Golden Test Results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: golden-test-failures
        path: |
          test/golden/
          test_driver/
        retention-days: 7
        
    - name: Comment on PR with Golden Test Results
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Check if golden test failures exist
          const goldenDir = 'test/golden/';
          if (fs.existsSync(goldenDir)) {
            const files = fs.readdirSync(goldenDir);
            const pngFiles = files.filter(file => file.endsWith('.png'));
            
            if (pngFiles.length > 0) {
              const comment = `## 🖼️ Golden Test Failures Detected
              
              The following golden test files have changed:
              
              ${pngFiles.map(file => `- \`${file}\``).join('\n')}
              
              ### What this means:
              - Visual changes have been detected in the UI
              - This could be intentional (new features) or unintentional (regressions)
              
              ### Next steps:
              1. **Review the changes**: Check if the visual changes are expected
              2. **If intentional**: Update golden files with \`flutter test --update-goldens\`
              3. **If unintentional**: Fix the UI issues and push again
              
              ### Commands to update golden files:
              \`\`\`bash
              flutter test --update-goldens
              \`\`\`
              
              ---
              *This comment was automatically generated by the Golden Tests workflow.*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          }
